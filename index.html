<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tikibar">
<meta name="theme-color" content="#000000">
<title>Welcome to Tikibar</title>
<style>
  :root{
    --bg:#0a0e14;
    --card:#141a24;
    --accent:#ffb347;
    --accent2:#ff6f61;
    --text:#f2ede3;
    --muted:#9aa5b1;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:radial-gradient(circle at top, #10182a 0%, #05070c 70%);
    color:var(--text);
    padding-bottom:40px;
  }
  header{
    text-align:center;
    padding:40px 20px 20px;
  }
  header .emoji{font-size:2rem;}
  header h1{
    font-size:2.4rem;
    margin:8px 0 4px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  header p{color:var(--muted); margin:0; font-size:.95rem;}
  section{padding:20px;}
  h2.cat{
    font-size:1.1rem;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--accent);
    margin:28px 0 12px;
  }
  .item{
    background:var(--card);
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:10px;
    border:1px solid rgba(255,255,255,.05);
    cursor:pointer;
    transition:transform .1s ease, border-color .15s ease;
  }
  .item:active{transform:scale(.97);}
  .item:hover{border-color:rgba(255,179,71,.4);}
  .item .name{font-weight:600; font-size:1.05rem; display:flex; align-items:center; justify-content:space-between;}
  .item .name::after{content:"→"; color:var(--accent); font-weight:400;}
  .item .desc{color:var(--muted); font-size:.88rem; margin-top:2px;}
  .hint{
    text-align:center;
    color:var(--muted);
    font-size:.85rem;
    padding:0 20px 10px;
  }
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.7);
    display:none;
    align-items:flex-end;
    justify-content:center;
    z-index:50;
  }
  .modal-overlay.open{display:flex;}
  .modal{
    background:var(--card);
    width:100%;
    max-width:480px;
    border-radius:20px 20px 0 0;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));
    max-height:85vh;
    overflow-y:auto;
  }
  .modal h3{margin-top:0; font-size:1.3rem;}
  .modal .q{margin:20px 0 8px; font-weight:600; color:var(--muted); font-size:.9rem; text-transform:uppercase; letter-spacing:.06em;}
  .options{display:flex; flex-wrap:wrap; gap:8px;}
  .opt{
    padding:10px 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.15);
    background:transparent;
    color:var(--text);
    cursor:pointer;
    font-size:.95rem;
  }
  .opt.selected{
    background:var(--accent);
    color:#1a0f00;
    border-color:var(--accent);
    font-weight:700;
  }
  .field-input{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.15);
    background:transparent;
    color:var(--text);
    font-size:1rem;
  }
  .field-input::placeholder{color:var(--muted);}
  .field-input:focus{outline:none; border-color:var(--accent);}
  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:24px;
  }
  .modal-actions button{
    flex:1;
    padding:14px;
    border-radius:14px;
    border:none;
    font-weight:700;
    cursor:pointer;
  }
  .btn-cancel{background:transparent; color:var(--muted); border:1px solid rgba(255,255,255,.15) !important;}
  .btn-send{background:linear-gradient(90deg,var(--accent),var(--accent2)); color:#1a0f00;}
  footer{text-align:center; color:var(--muted); padding:30px 0 10px; font-size:1.4rem;}
</style>
</head>
<body>

<header>
  <div class="emoji">🍹🍺🍿</div>
  <h1>Tikibar</h1>
  <p>Cocktails d'exception, maîtrisés par Psycho<br>(si Psycho plus étanche, Alfred prend la suite)</p>
</header>

<p class="hint">👉 Touche un cocktail pour le commander</p>

<section id="menu"></section>

<div class="modal-overlay" id="overlay">
  <div class="modal">
    <h3 id="modal-title">Tu commandes</h3>

    <div class="q">Ton prénom</div>
    <input type="text" id="prenom-input" class="field-input" placeholder="Ton prénom" maxlength="30" autocomplete="given-name">

    <div class="q">Où es-tu ?</div>
    <div class="options" data-group="lieu">
      <button class="opt" data-value="Billard">Billard</button>
      <button class="opt" data-value="Salon">Salon</button>
      <button class="opt" data-value="Tikibar">Tikibar</button>
      <button class="opt" data-value="Salon extérieur">Salon extérieur</button>
      <button class="opt" data-value="Jacuzzi">Jacuzzi</button>
    </div>

    <div class="q" id="glacons-question" style="display:none;">Avec glaçons ?</div>
    <div class="options" data-group="glacons" id="glacons-group" style="display:none;">
      <button class="opt" data-value="Avec glaçons">Avec glaçons</button>
      <button class="opt" data-value="Sans glaçons">Sans glaçons</button>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Annuler</button>
      <button class="btn-send" onclick="sendOrder()">Envoyer 🍹</button>
    </div>

    <div id="print-status" style="text-align:center; margin-top:14px; font-size:.9rem; color:var(--muted);"></div>
  </div>
</div>

<footer>🌴🌞🦜</footer>

<script>
// ------- CONFIG -------
// Webhook Home Assistant (via Nabu Casa, joignable depuis n'importe quel réseau).
// Déclenche l'automation "Tikibar - Commande vers iPhone Psycho" qui notifie
// l'iPhone de Psycho et tente de lancer le Raccourci "TikibarPrint".
const PRINT_RELAY_URL = "https://a5ep397zy4zubj4re2yy7dubfztmhbnc.ui.nabu.casa/api/webhook/tikibar-b2aad63d2949dcacbab3a69813d2423e";

const menu = {
  "Grands classiques": [
    ["Mojito", "Rhum blanc, sucre de canne, citron vert, menthe, eau gazeuse."],
    ["Gin tonic", "Gin, tonic, glaçons, zeste de citron ou concombre."],
    ["Piña colada", "Rhum blanc, jus d'ananas, crème de coco, glace pilée."],
    ["Margarita", "Tequila, triple sec, jus de citron vert, sel."],
    ["Moscow mule", "Vodka, ginger beer, citron vert, glaçons."],
    ["Daiquiri", "Rhum blanc, jus de citron vert, sirop de sucre."],
    ["Negroni", "Gin, Campari, vermouth rouge, à parts égales."],
    ["Cosmopolitan", "Vodka, triple sec, jus de cranberry, citron vert."],
    ["Whisky sour", "Whisky, jus de citron, sirop de sucre, trait d'angostura."],
    ["St-Germain Spritz", "St-Germain, vin pétillant, eau gazeuse, zeste de citron."],
    ["Cuba Libre", "Rhum blanc, Coca, citron vert."],
    ["Dark 'n' Stormy", "Rhum ambré, ginger beer, citron vert."],
    ["Ti' Punch", "Rhum ambré, sucre de canne, citron vert."],
    ["Whisky Buck", "Whisky, ginger beer, citron vert."],
    ["Americano", "Campari, vermouth rouge, eau gazeuse."],
    ["Campari Spritz", "Campari, vin pétillant, eau gazeuse."],
    ["Vodka Cranberry", "Vodka, jus de cranberry."],
    ["Screwdriver", "Vodka, jus de fruits."],
    ["Rhum Punch tropical", "Rhum ambré, jus d'ananas, jus de cranberry, sirop de sucre."],
    ["Planteur", "Rhum ambré, jus d'ananas, jus de cranberry, trait d'angostura, sirop de sucre."],
    ["Tequila Sunrise", "Tequila, jus d'orange, grenadine."],
    ["Paloma", "Tequila, citron vert, sel, soda pamplemousse."],
    ["Kir Royal", "Vin pétillant, crème de cassis."]
  ],
  "Spiritueux": [
    ["Whisky", "Servi sec ou sur glaçons, au choix."],
    ["Rhum", "Blanc ou ambré, avec ou sans glaçons."],
    ["Vodka", "Pure, avec ou sans glaçons."],
    ["Vin", "Rouge, blanc ou rosé, au choix."],
    ["Bière", "Corona, Desperados ou Leffe, au choix."]
  ],
  "Softs": [
    ["Coca", "Coca-Cola bien frais."],
    ["Red Bull", "Red Bull glacé."],
    ["Limonade", "Limonade pétillante."],
    ["Jus de fruits", "Orange, pomme ou ananas."],
    ["Perrier", "Eau gazeuse Perrier, glaçons."]
  ]
};

// Seule la categorie "Spiritueux" propose le choix des glacons (whisky, rhum,
// vodka, vin, biere...) - les cocktails ont deja les glacons dans la recette.
const GLACONS_CATEGORIES = ["Spiritueux"];

const menuEl = document.getElementById('menu');
for (const [cat, items] of Object.entries(menu)) {
  const h2 = document.createElement('h2');
  h2.className = 'cat';
  h2.textContent = cat;
  menuEl.appendChild(h2);
  items.forEach(([name, desc]) => {
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<div class="name">${name}</div><div class="desc">${desc}</div>`;
    div.addEventListener('click', () => openModal(name, cat));
    menuEl.appendChild(div);
  });
}

document.querySelectorAll('.options').forEach(group => {
  group.addEventListener('click', e => {
    const btn = e.target.closest('.opt');
    if (!btn) return;
    group.querySelectorAll('.opt').forEach(o => o.classList.remove('selected'));
    btn.classList.add('selected');
  });
});

function getSelected(group) {
  const el = document.querySelector(`.options[data-group="${group}"] .opt.selected`);
  return el ? el.dataset.value : null;
}

let currentBoisson = null;
let currentCategory = null;
let lastOrderText = "";

// ------- Anti-spam : 1 commande toutes les 20 minutes par appareil -------
// (par appareil et non par prénom : sinon il suffit de taper un faux prénom
// pour contourner la limite)
const COOLDOWN_MS = 20 * 60 * 1000;
const COOLDOWN_KEY = 'tikibar_last_order_ts';
const COOLDOWN_MESSAGES = [
  "Doucement champion, laisse decanter 🍹 Encore {min} min avant la prochaine.",
  "L'abus d'alcool est dangereux, meme pour toi 😏 Reviens dans {min} min.",
  "Ton foie te remercie de patienter encore {min} min.",
  "Le barman est en pause forcee. Encore {min} min de patience."
];

function setCooldown(){
  localStorage.setItem(COOLDOWN_KEY, String(Date.now()));
}
function checkCooldown(){
  const last = Number(localStorage.getItem(COOLDOWN_KEY) || 0);
  if (!last) return null;
  const remaining = COOLDOWN_MS - (Date.now() - last);
  if (remaining <= 0) return null;
  return Math.ceil(remaining / 60000);
}

function openModal(boisson, category){
  currentBoisson = boisson;
  currentCategory = category;
  document.getElementById('modal-title').textContent = `Tu commandes : ${boisson}`;

  const needsGlacons = GLACONS_CATEGORIES.includes(category);
  document.getElementById('glacons-question').style.display = needsGlacons ? '' : 'none';
  document.getElementById('glacons-group').style.display = needsGlacons ? '' : 'none';

  document.getElementById('overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('print-status').textContent = '';
  document.getElementById('prenom-input').value = '';
  document.querySelectorAll('.opt.selected').forEach(o => o.classList.remove('selected'));
}

async function sendOrder(){
  const prenom = document.getElementById('prenom-input').value.trim();
  const lieu = getSelected('lieu');
  const needsGlacons = GLACONS_CATEGORIES.includes(currentCategory);
  const glacons = needsGlacons ? getSelected('glacons') : null;
  const statusEl = document.getElementById('print-status');

  if (!prenom) {
    alert("Indique ton prénom 🙏");
    return;
  }
  if (!currentBoisson || !lieu) {
    alert("Choisis un lieu 🙏");
    return;
  }
  if (needsGlacons && !glacons) {
    alert("Avec ou sans glaçons ? 🙏");
    return;
  }

  const remainingMin = checkCooldown();
  if (remainingMin !== null) {
    const msg = COOLDOWN_MESSAGES[Math.floor(Math.random() * COOLDOWN_MESSAGES.length)];
    statusEl.textContent = "🙅 " + msg.replace('{min}', remainingMin);
    return;
  }

  lastOrderText = `🍹 Commande Tikibar\nPrénom : ${prenom}\nLieu : ${lieu}\nBoisson : ${currentBoisson}` +
    (glacons ? `\nGlaçons : ${glacons}` : '');

  if (!PRINT_RELAY_URL) {
    statusEl.textContent = "Envoi pas encore configuré (PRINT_RELAY_URL vide).";
    return;
  }

  statusEl.textContent = "Envoi de la commande…";
  try {
    const res = await fetch(PRINT_RELAY_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prenom,
        lieu,
        boisson: currentBoisson,
        glacons: glacons || '',
        text: lastOrderText,
        ts: new Date().toISOString()
      })
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    setCooldown();
    statusEl.textContent = "✅ Ton cocktail arrive !";
    setTimeout(closeModal, 1500);
  } catch (err) {
    statusEl.textContent = "❌ Échec de l'envoi de la commande, réessaie.";
  }
}
</script>
</body>
</html>
